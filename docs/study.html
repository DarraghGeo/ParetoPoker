<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A refresh, or a tab the browser reloads, opens on the choice between Study and Train; this address followed or typed stays here -->
<script>if (performance.getEntriesByType('navigation')[0]?.type === 'reload') location.replace('./');</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pareto: Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=960cbb15c4">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pareto">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Installed or not, the page keeps itself current: a worker that always asks the network first, a check for a newer
// build each time the app comes back to the front, and a reload when one is there (on the opening page only, so that
// a study in progress is never thrown away).
if ('serviceWorker' in navigator) {
  const here = '960cbb15c4'; const opening = !/(study|train)\.html/.test(location.pathname);
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const check = async () => {
      try { reg.update(); const latest = (await (await fetch('version.json', { cache: 'no-store' })).json()).version; if (latest && latest !== here && opening) location.reload(); } catch { /* offline */ }
    };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    addEventListener('pageshow', (ev) => { if (ev.persisted) check(); });
  }).catch(() => {});
}
</script>
</head>
<body>
<div class="rule" id="rule"></div>
<main>
  <header>
    <a class="logo" href="./" aria-label="Home"><svg class="mark" viewBox="0 0 512 512" width="26" height="26" aria-hidden="true"><rect width="512" height="512" rx="72" fill="#15171B"/><rect x="96" y="150" width="68" height="212" fill="#7FCDBB"/><rect x="180" y="150" width="68" height="212" fill="#F4C261"/><rect x="180" y="150" width="68" height="90" fill="#7FCDBB"/><rect x="264" y="150" width="68" height="212" fill="#F4C261"/><rect x="348" y="150" width="68" height="212" fill="#F08A6B"/><rect x="348" y="150" width="68" height="60" fill="#F4C261"/></svg></a>
    <div class="board" id="board"></div>
    <nav class="versions" id="versions" aria-label="Versions" hidden>
      <button type="button" class="icon" id="older" aria-label="Previous version"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span id="version"></span>
      <button type="button" class="icon" id="newer" aria-label="Next version"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
    <span class="grow"></span>
    <span id="state" hidden></span>
    <button type="button" class="icon" id="seats" aria-label="Ranges by position and preflop action" title="Positions"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><ellipse cx="8" cy="8" rx="6" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="3.2" cy="3.6" r="1.1" fill="currentColor"/><circle cx="12.8" cy="3.6" r="1.1" fill="currentColor"/><circle cx="8" cy="13.6" r="1.1" fill="currentColor"/></svg></button>
    <button type="button" class="icon" id="copy" aria-label="Copy this spot" title="Copy this spot"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5.5 5.5v-3h8v8h-3M2.5 5.5h8v8h-8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="icon" id="edit" aria-label="Edit ranges" title="Edit ranges"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 13l.6-2.8L10.9 3a1.1 1.1 0 0 1 1.6 0l.5.5a1.1 1.1 0 0 1 0 1.6L5.8 12.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="icon" id="open-setup" aria-label="Setup">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h8M13 4h1M2 8h2M7 8h7M2 12h6M11 12h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11.5" cy="4" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="8" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9.5" cy="12" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>
  <section class="stage">
    <div class="left">
      <nav class="line" id="line" aria-label="Line"></nav>
      <div class="box">
        <div class="range" id="range"></div>
        <div class="curve" id="dist" hidden></div>
        <div class="deal" id="deal" hidden role="group" aria-label="Card dealt"></div>
      </div>
      <div class="stripbox"><div class="strip" id="strip"></div></div>
      <div class="combos" id="combos"></div>
    </div>
    <aside class="why" id="why" aria-live="polite"></aside>
  </section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer group" id="group" hidden aria-label="Hands of this kind" tabindex="-1"></aside>
<div class="loader" id="loader" hidden role="status" aria-live="polite">
  <div class="card">
    <div class="title" id="l-title"></div>
    <div class="track"><i id="l-fill"></i></div>
    <div class="meta"><span id="l-now"></span><span class="grow"></span><button type="button" id="l-stop">Stop</button></div>
  </div>
</div>
<div class="pop theirs" id="theirs" hidden role="img" aria-label="The other player's range"></div>
<div class="pop seatpick" id="seatpick" hidden role="group" aria-label="Ranges by position and preflop action"></div>
<div class="deal pop" id="cardpick" hidden role="group" aria-label="Board card"></div>
<section class="editor" id="editor" hidden aria-label="Edit ranges" tabindex="-1">
  <div class="ed-head">
    <div class="seg" role="group" aria-label="Range">
      <button type="button" id="e-oop" aria-pressed="true">OOP</button>
      <button type="button" id="e-ip" aria-pressed="false">IP</button>
    </div>
    <span class="count" id="e-count"></span>
    <span class="grow"></span>
    <button type="button" id="e-cancel">Cancel</button>
    <button type="button" class="primary" id="e-save">Save</button>
  </div>
  <div class="ed-body">
    <div class="paint" id="e-paint" role="group" aria-label="Range chart"></div>
    <div class="curve" id="e-curve"></div>
  </div>
  <div class="sliders" id="e-sliders"></div>
</section>
<form class="drawer" id="drawer" hidden aria-label="Setup" tabindex="-1">
  <div class="spot-only">
    <button type="button" class="link" id="f-sub" hidden>Re-solve from this street</button>
    <label>Board<input id="f-board" autocomplete="off" spellcheck="false"></label>
    <div class="presets" id="f-presets" aria-label="Ranges by position and preflop action"></div>
    <div class="painter">
      <div class="head">
        <div class="seg" role="group" aria-label="Range">
          <button type="button" id="p-oop" aria-pressed="true">OOP</button>
          <button type="button" id="p-ip" aria-pressed="false">IP</button>
        </div>
        <span class="count" id="p-count"></span>
        <button type="button" class="clear" id="p-clear">Clear</button>
      </div>
      <div class="paint" id="paint" role="group" aria-label="Range chart"></div>
      <textarea id="f-range" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Range notation"></textarea>
    </div>
  </div>
  <div class="row">
    <label>Pot<input id="f-pot" inputmode="decimal"></label>
    <label>Behind<input id="f-stack" inputmode="decimal"></label>
  </div>
  <div class="row">
    <label>Bets %<input id="f-bets" autocomplete="off"></label>
    <label>Raises x<input id="f-raise" autocomplete="off"></label>
  </div>
  <div class="row">
    <label>Raises allowed<input id="f-max" inputmode="numeric"></label>
    <label class="check">All-in<input id="f-allin" type="checkbox"></label>
  </div>
  <p class="error" id="f-error" role="alert"></p>
  <p class="error fit" id="f-fit"></p>
  <button type="submit" class="primary" id="f-solve">Solve</button>
</form>
<script type="module" src="app.js?v=960cbb15c4"></script>
</body>
</html>
