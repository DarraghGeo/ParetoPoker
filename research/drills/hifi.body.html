<div id="app"></div>
<script>
const D = /*DATA*/;
const GLYPH = { s: '♠', h: '♥', d: '♦', c: '♣' }; const NAMES = { SRP: 'Single-raised pot', '3BP': '3-bet pot', '4BP': '4-bet pot', Squeeze: 'Squeezed pot' };
const cards = (t) => t.replace(/ /g, '').match(/[2-9TJQKA][shdc]/g).map((c) => `<span class="s-${c[1]}">${c[0]}${GLYPH[c[1]]}</span>`).join(''); const pct = (x) => `${Math.round(100 * x)}%`;
const PATHS = { tick: 'M3.5 8.5l3 3 6-7', cross: 'M4 4l8 8M12 4l-8 8', settings: 'M2 4h8M13 4h1M2 8h2M7 8h7M2 12h6M11 12h3M10 4a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0M4 8a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0M8 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0', back: 'M10 3L5 8l5 5', study: 'M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5' };
const icon = (n, size = 16) => `<svg viewBox="0 0 16 16" width="${size}" height="${size}" aria-hidden="true"><path d="${PATHS[n]}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const MARK = (s) => `<svg class="mark" viewBox="0 0 512 512" width="${s}" height="${s}" aria-hidden="true"><rect width="512" height="512" rx="72" fill="#15171B"/><rect x="96" y="150" width="68" height="212" fill="#7FCDBB"/><rect x="180" y="150" width="68" height="212" fill="#F4C261"/><rect x="180" y="150" width="68" height="90" fill="#7FCDBB"/><rect x="264" y="150" width="68" height="212" fill="#F4C261"/><rect x="348" y="150" width="68" height="212" fill="#F08A6B"/><rect x="348" y="150" width="68" height="60" fill="#F4C261"/></svg>`;
const place = (k) => k + 1 + (k > 4) + (k > 8); const RANKS = 'AKQJT98765432';
const cellOf = (h) => { const a = RANKS.indexOf(h[0]), b = RANKS.indexOf(h[1]); return h.length === 2 ? [a, a] : h[2] === 's' ? [Math.min(a, b), Math.max(a, b)] : [Math.max(a, b), Math.min(a, b)]; };
const mini = (title, g, { villain = false, mark = null, solo = false } = {}) => { let n = 0; const cells = g.map((row, i) => row.map((w, j) => { n += w * (i === j ? 6 : j > i ? 4 : 12); return `<b${mark && mark[0] === i && mark[1] === j ? ' class="mark"' : ''} style="grid-column:${place(j)};grid-row:${place(i)}"><i style="height:${Math.round(100 * w)}%"></i></b>`; }).join('')).join('');
  return `<figure class="mini${villain ? ' villain' : ''}${solo ? ' solo' : ''}"><figcaption><span>${title}</span><span>${Math.round(n)}</span></figcaption><div class="paint" role="img">${cells}</div></figure>`; };
const past = (rows) => `<div class="past">${rows.map(([st, acts]) => `<div><span class="street">${st}</span>${acts.map(([who, what]) => `<span><i>${who}</i> ${what}</span>`).join('')}</div>`).join('')}</div>`;
const where = (who, stands, extra = '') => `<div class="where"><span class="who">${who}</span><span class="stands">${stands}</span><span class="grow"></span>${extra}</div>`;
const strip = (rows, cols, cls = '') => `<div class="strip mock ${cls}">${rows.map((m) => `<button type="button" tabindex="-1"><b style="height:100%">${m.map((p, a) => [p, a]).reverse().map(([p, a]) => `<i style="height:${100 * p}%;background:var(${cols[a]})"></i>`).join('')}</b></button>`).join('')}</div>`;
const cmp = (names, vals, ex, scale = 1) => `<ul class="cmp">${[0, 1].map((i) => `<li><span>${names[i]}</span><span class="bar"><i class="${i ? 'v' : ''}" style="width:${Math.min(100, 100 * scale * vals[i])}%"></i></span><span>${pct(vals[i])}</span></li>${ex && ex[i]?.length ? `<li><span></span><span class="ex">${ex[i].join(' ')}</span></li>` : ''}`).join('')}</ul>`;
const eqbar = (names, eq, dp = 0) => `<div class="eq"><span>${names[0]} ${(100 * eq[0]).toFixed(dp)}%</span><span class="bar"><i style="width:${100 * eq[0]}%"></i><i class="v" style="width:${100 * eq[1]}%"></i></span><span class="v">${(100 * eq[1]).toFixed(dp)}% ${names[1]}</span></div>`;
const fact = (t) => `<p class="fact">${t}</p>`; const hint = (t) => `<p class="hint">${t}</p>`;
const app = document.getElementById('app'); const done = {};

const DRILLS = [];
// ---- 1. ranges
DRILLS.push({ id: 'whose', group: 0, kind: 'Ranges', name: 'Whose range is this?', what: 'See a range, name the position and the action.', items: [2, 0, 3].map((k) => ({ left: () => mini('Range', D.grids[k].g, { solo: true }), text: 'Whose range is this?', one: true, options: D.grids.map((g, i) => [String(i), g.label]), answer: String(k),
  after: () => fact(['The tightest open: big pairs, big aces and suited broadways, almost nothing offsuit below AJ.', 'The widest open: every pair, most suited hands and a wide band of offsuit broadways.', 'A calling range has a hole at the top: the best hands 3-bet, so AA, KK and AK are missing. What is left is suited and connected.', 'A 3-betting range is the top of the deck plus a few suited bluffs, with the middle left out.'][k]) + hint('All 49 preset ranges take turns here. The ones you miss come back sooner.') })) });
DRILLS.push({ id: 'inout', group: 0, kind: 'Ranges', name: 'In or out?', what: 'See a position and a hand, say whether it is in the range.', items: D.inout.hands.slice(0, 5).map(([h, w]) => ({ left: (g) => past([['Pre', [['BU', 'raises'], ['BB', 'calls']]]]) + (g != null ? mini('BB calls a BU open', D.grids[2].g, { solo: true, mark: cellOf(h) }) : ''), plain: h, text: `Is it in BB's range?`, options: [['a', 'Always or nearly'], ['s', 'Sometimes'], ['n', 'Never']], answer: w >= 0.85 ? 'a' : w <= 0.05 ? 'n' : 's',
  after: () => fact(`BB calls with ${h} ${w >= 0.85 ? `nearly always (${pct(w)})` : w <= 0.05 ? 'never' : `${pct(w)} of the time`}.${h === 'AKo' ? ' It is too strong to call: it 3-bets.' : w > 0.05 && w < 0.85 ? ' The rest of the time it 3-bets or folds.' : ''}`) })) });
// ---- 2. range advantage
const C = D.cards; const WORD = { A: 'an ace', K: 'a king', 9: 'a nine', 5: 'a five' };
DRILLS.push({ id: 'card', group: 1, kind: 'Range advantage', name: 'Whose card is it?', what: 'One rank, two ranges: who holds more of it.', items: ['K', '5', '9', 'A'].map((r) => { const [a, b] = C.share[r]; const ans = Math.abs(a - b) < 0.025 ? 'close' : a > b ? '0' : '1'; return { left: (g) => past([['Pre', [['BU', 'raises'], ['BB', 'calls']]]]) + (g != null ? `<div class="minis">${mini('BB', D.grids[2].g)}${mini('BU', D.grids[1].g, { villain: true })}</div>` : ''), plain: r, text: `Who has more hands with ${WORD[r]} in them, as a share of the range?`, options: [['0', 'BB'], ['close', 'Close'], ['1', 'BU']], answer: ans,
  after: () => cmp(C.names, C.share[r], null, 2.5) + fact(`${ans === 'close' ? 'About the same share of each range. Nines sit where the two ranges overlap.' : `${C.names[+ans]} has more of them.`} ${ans === 'close' ? '' : 'AK'.includes(r) ? 'The opener holds more of the high cards: the caller 3-bets some of its best ones, and the opener starts with more offsuit broadways.' : 'The caller holds more of the low and middle cards: it defends with suited and connected hands the opener folds.'}`) + hint('When this rank is the top card on the board, this is who has more top pair.') }; }) });
const reason = (q) => { const [a, b] = q.sides; const w = q.answer; const N = q.names; const sg = Math.sign(q.eq[0] - 0.5); const d = (k) => Math.sign(a[k] - b[k]); const v = (k, i) => pct(q.sides[i][k]);
  if (w === 'close') return { key: null, text: `It is close. ${a.tp > b.tp ? N[0] : N[1]} has more top pair or better, but ${a.pair > b.pair ? N[0] : N[1]} has more pairs and more of the biggest hands. They cancel.` };
  const W = N[w], L = N[1 - w];
  if (q.bettor != null) return { key: d('big') === sg ? 'big' : 'tp', text: `${N[q.bettor]} bet. A river bet is made of strong hands and bluffs, so after a bet the bettor nearly always has the advantage. The count agrees: ${v('big', w)} of ${W}'s range is two pair or better, against ${v('big', 1 - w)}.` };
  if (q.street === 5 && d('tp') !== sg && d('big') === sg) return { key: 'big', text: `Top pair is not the bar on the river. Top pair or better is level, but ${v('big', w)} of ${W}'s range is two pair or better, against ${v('big', 1 - w)} of ${L}'s.` };
  if (d('tp') === sg) return { key: 'tp', text: `${W} has more top pair or better on this board: ${v('tp', w)} of the range, against ${v('tp', 1 - w)} of ${L}'s.` };
  return { key: 'pair', text: `The exception. ${L} has more top pair or better, but ${W} has far more pairs of any kind: ${v('pair', w)} against ${v('pair', 1 - w)}. On a low board those pairs are worth a lot.` }; };
const RULE = { 3: 'Flop: who has more top pair or better, as a share of the range.', 4: 'Turn: the same count, then lean towards whoever has been betting.', 5: 'River: the bar rises to two pair or better, and whoever bet usually has it.' };
const hist = (q) => { const t = (x) => x.replace('checked through', `${q.names[0]}|checks ${q.names[1]}|checks`).replace('OOP checked, IP bet, OOP called', `${q.names[0]}|checks ${q.names[1]}|bets ${q.names[0]}|calls`).replace('OOP bet, IP called', `${q.names[0]}|bets ${q.names[1]}|calls`); const rows = [['Pre', [[NAMES[q.pre], '']]]]; q.hist.forEach((h, i) => rows.push([['Flop', 'Turn'][i], t(h).split(' ').map((p) => p.split('|'))])); if (q.street > 3 && /bets|checks/.test(q.cur)) rows.push([q.street === 4 ? 'Turn' : 'River', q.cur.replace('OOP checks, IP bets', `${q.names[0]}|checks ${q.names[1]}|bets`).replace('OOP bets', `${q.names[0]}|bets`).replace('OOP checks', `${q.names[0]}|checks`).split(' ').map((p) => p.split('|'))]); return past(rows); };
DRILLS.push({ id: 'adv', group: 1, kind: 'Range advantage', name: 'Who has the range advantage?', what: 'A board and the action so far.', items: D.adv.map((q) => ({ board: q.board, left: () => hist(q) + where('', `${q.names[0]} out of position · ${q.names[1]} in position`), text: 'Who has the range advantage?', options: [['0', q.names[0]], ['close', 'Close'], ['1', q.names[1]]], answer: String(q.answer),
  after: () => { const r = reason(q); const blk = (k, name, ex) => `<div class="blk${r.key && r.key !== k ? ' dim' : ''}"><b><span>${name}</span>${r.key === k ? '<em>decides it</em>' : ''}</b>${cmp(q.names, [q.sides[0][k], q.sides[1][k]], ex && r.key === k ? [q.sides[0][ex], q.sides[1][ex]] : null)}</div>`; return eqbar(q.names, q.eq) + fact(r.text) + blk('tp', 'Top pair or better', 'exTp') + (q.street === 5 || r.key === 'big' ? blk('big', 'Two pair or better', 'exBig') : '') + blk('pair', 'Any pair or better') + hint(RULE[q.street]); } })) });
const T = D.turn; DRILLS.push({ id: 'moved', group: 1, kind: 'Range advantage', name: 'Did the card move it?', what: 'A turn card lands: who does it help.', items: T.turns.map((t) => { const d = t.eq - T.eq; const ans = Math.abs(d) < 0.008 ? 'same' : d > 0 ? '0' : '1'; const r = t.card[0]; return { board: `${T.flop} ${t.card}`, left: () => past([['Pre', [['BU', 'raises'], ['BB', 'calls']]], ['Flop', [['BB', `${pct(T.eq)}`], ['BU', `${pct(1 - T.eq)}`]]]]) + where('No betting yet', `The turn is ${cards(t.card)}`), text: 'Who does this card help?', options: [['0', 'BB'], ['same', 'No one'], ['1', 'BU']], answer: ans,
  after: () => eqbar(T.names, [t.eq, 1 - t.eq], 1) + fact(`${ans === 'same' ? 'It barely moves.' : `It moves ${Math.abs(100 * d).toFixed(1)} points towards ${T.names[+ans]}.`} ${'AK'.includes(r) ? `A high card is the opener's card: BU has more hands with ${WORD[r]} in them, so more of its range just made top pair.` : r === '6' ? `A middle card that connects with the board is the caller's card: BB has more of the hands that make straights and two pair here.` : `The third spade helps the caller a little: its range has more suited hands.`}`) + hint('Ask "whose card is it?" of the new card.') }; }) });
// ---- 3. actions
const RV = D.river; const SH = { 'Check all': [10, 6, 5, 4, 4, 5, 8, 12, 13, 13], 'Top, some rest': [34, 33, 31, 27, 21, 20, 22, 38, 66, 74], 'Both ends': [82, 53, 19, 9, 8, 21, 59, 86, 92, 91], 'Top half': [29, 33, 38, 37, 41, 66, 82, 86, 88, 82], 'Bet all': [74, 72, 66, 62, 71, 77, 80, 86, 92, 91] };
const rbet = RV.actions.filter((a) => a.kind !== 'check').reduce((t, a) => t + a.freq, 0); const rleft = (g) => past([['Flop', [['SB', 'checks'], ['BB', 'checks']]], ['Turn', [['SB', 'checks'], ['BB', 'checks']]]]) + where('Hero SB', 'First to act', '<span class="chips">Pot 6</span><span class="chips">Behind 97</span>') + `<div class="tally"><span><b>${pct(RV.top70[0])}</b>of your hands beat 70% of his</span><span><b>${pct(RV.top70[1])}</b>of his beat 70% of yours</span></div>` + (g != null ? `<div>${strip(RV.bar, ['--act-check', '--act-big'])}<div class="ends" style="margin-top:6px"><span>weakest</span><span>strongest</span></div></div><div class="keyrow"><span><i class="sw" style="background:var(--act-check)"></i>X</span><span><i class="sw" style="background:var(--act-big)"></i>B75</span></div>` : '');
DRILLS.push({ id: 'range', group: 2, kind: 'Actions', name: 'How does the range bet?', what: 'How often, and in what shape.', items: [
  { board: RV.board, left: rleft, text: 'How much of your range bets?', options: [['a', 'Under 20%'], ['b', '20 to 45%'], ['c', '45 to 70%'], ['d', 'Over 70%']], answer: 'b', after: () => fact(`You bet ${pct(rbet)} of the range. You have twice his share of strong hands, so you can bet. But most of your range is middling hands that win often enough by checking.`) },
  { board: RV.board, left: rleft, text: 'Which shape does the betting take?', shapes: SH, options: Object.keys(SH).map((n) => [n, n]), answer: 'Both ends', after: () => fact('Both ends. The strongest hands bet for value and the weakest bet as bluffs, because they cannot win a showdown. The middle checks.') + hint('A betting range is nearly always one of these five shapes.') }] });
const F = D.face; const fb = Math.round(100 * F.toCall / (F.pot - F.toCall));
DRILLS.push({ id: 'line', group: 2, kind: 'Actions', name: 'Where is the line?', what: 'Facing a bet: how much of your range continues.', items: [{ board: F.board, tap: true, answer: 1 - F.cont, text: 'Tap the strip where calling starts.',
  left: (g) => past([['Flop', [['SB', 'checks'], ['UTG', 'checks']]], ['Turn', [['SB', 'checks'], ['UTG', 'checks']]], ['River', [['SB', `B${fb}`]]]]) + where('Hero UTG', `Facing B${fb}`) + (g == null ? `<div>${strip(F.bar.map(() => [0]), ['--surface'], 'tap')}<div class="ends" style="margin-top:6px"><span>weakest</span><span>strongest</span></div></div>` : `<div><div class="strip mock">${F.bar.map((m) => `<button type="button" tabindex="-1"><b style="height:100%"><i style="height:${100 * m[1]}%;background:var(--act-check)"></i><i style="height:${100 * m[0]}%;background:var(--act-fold)"></i></b></button>`).join('')}<span class="pin you" style="left:${100 * g}%"><u>you</u></span><span class="pin" style="left:${100 * (1 - F.cont)}%"><u>line</u></span><span class="pin thin" style="left:${100 * (1 - F.priceRank)}%"><u>price</u></span></div><div class="ends"><span>weakest</span><span>strongest</span></div></div><div class="keyrow"><span><i class="sw" style="background:var(--act-fold)"></i>F</span><span><i class="sw" style="background:var(--act-check)"></i>C</span></div>`),
  after: () => fact(`You continue with the top ${pct(F.cont)} of your range. ${pct(F.priceRank)} of your hands have the ${pct(F.price)} equity a call needs, but the line sits above the price: the hands just over it are beaten too often by what he bets.`) + hint('Facing a bet, the whole answer is one line on your range.') }] });
const hleft = () => past([['Flop', [['SB', 'checks'], ['BB', 'checks']]], ['Turn', [['SB', 'checks']]]]) + where('Hero BB', 'Checked to you', '<span class="chips">Pot 6</span><span class="chips">Behind 97</span>');
DRILLS.push({ id: 'hand', group: 2, kind: 'Actions', name: 'What does this hand do?', what: 'One hand, then its twin.', items: [
  { board: 'Ad 8h 5d 7d', left: hleft, hand: 'Td9s', sub: '37% equity', one: true, text: 'What does it do, and why?', options: [['x1', 'Check: it wins often enough at showdown', '--act-check'], ['b1', 'Bet: it wins nothing unless it improves', '--act-big'], ['b2', 'Bet: worse hands will call', '--act-big']], answer: 'b1', after: () => fact('It always bets. Every bit of its 37% comes from cards still to come. Checked down, it wins nothing. He folds about half the time, and when called it can still get there.') },
  { board: 'Ad 8h 5d 7d', left: hleft, hand: '3h3s', sub: '36% equity, the same as T♦9♠', text: 'What does it do?', options: [['x', 'X', '--act-check'], ['b', 'B75', '--act-big']], answer: 'x', after: () => fact('It never bets. Nearly all of its 36% is showdown: it is ahead of his missed hands now and has almost nothing to improve to.') + `<div class="twin"><b>${cards('Td9s')}</b><span class="bar"><i style="width:0%;background:var(--ink)"></i><i style="width:37%;background:var(--accent)"></i></span><span>bets</span><b>${cards('3h3s')}</b><span class="bar"><i style="width:34%;background:var(--ink)"></i><i style="width:2%;background:var(--accent)"></i></span><span>checks</span></div><div class="keyrow"><span><i class="sw" style="background:var(--ink)"></i>wins now</span><span><i class="sw" style="background:var(--accent)"></i>wins if it improves</span></div>` + hint('Same equity, opposite play. Among weak hands, what is still to come decides who bets.') }] });

// ---- the shell
const GROUPS = ['1 · Ranges', '2 · Range advantage', '3 · Actions'];
function menu() { app.className = ''; app.innerHTML = `<div class="rule"></div><main class="home"><h1>${MARK(44)}<span>Train</span></h1><p class="lede">Three things to learn, in order: the ranges, who has the advantage, and what to do about it. Each drill asks first and explains after.</p>` + GROUPS.map((g, i) => `<h3>${g}</h3><nav class="choose">${DRILLS.filter((d) => d.group === i).map((d) => `<a data-id="${d.id}" role="button" tabindex="0"><span><span class="kind">${d.name}</span><span class="what">${d.what}</span></span><span class="n${done[d.id] ? ' done' : ''}">${done[d.id] ?? d.items.length}</span></a>`).join('')}</nav>`).join('') + `<p class="note">A mock-up in the app's own styles. Every range, equity, count and strip is real: the preset ranges and solved spots. The explanation sentences are written for the mock-up, and each drill shows only a few questions.</p></main>`;
  app.querySelectorAll('.choose a').forEach((b) => { b.onclick = () => run(DRILLS.find((d) => d.id === b.dataset.id)); }); window.scrollTo(0, 0); }
function run(d) { let at = 0; const res = []; app.className = 'train';
  const show = (given) => { const it = d.items[at]; const ok = given != null ? res[res.length - 1] : null; const good = res.filter(Boolean).length;
    const opts = it.tap ? '' : `<div class="opts${it.one ? ' one' : ''}${it.shapes ? ' shapes' : ''}${given != null && !ok ? ' missed' : ''}" role="group" aria-label="Answers">${it.options.map(([v, label, col]) => { const mark = given == null ? '' : v === it.answer ? 'right' : v === given ? 'wrong' : ''; return `<button type="button" class="opt ${mark}" data-v="${v}" aria-pressed="${v === given}"${given != null ? ' disabled' : ''}>${it.shapes ? `<span class="shape">${it.shapes[v].map((x) => `<b style="height:${x}%"></b>`).join('')}</span>` : ''}${col ? `<i class="sw" style="background:var(${col})"></i>` : ''}<span>${label}</span>${mark ? icon(mark === 'right' ? 'tick' : 'cross', 14) : ''}</button>`; }).join('')}</div>`;
    const verdict = given == null ? '' : `<div class="verdict ${ok ? 'good' : 'bad'}" role="status">${icon(ok ? 'tick' : 'cross', 14)}<span>${it.tap ? (ok ? 'Close: within a few hands of the line' : given > it.answer ? 'Too tight: the line is further left' : 'Too loose: the line is further right') : ok ? 'Correct' : 'Not this time'}</span></div>${it.after(given)}<button type="button" class="primary" id="next">${at + 1 < d.items.length ? 'Next' : 'Done'}</button>`;
    app.innerHTML = `<div class="rule">${res.length ? `<i style="flex:${good};background:var(--ok)"></i><i style="flex:${res.length - good};background:var(--danger)"></i>` : ''}</div><main><header><a class="logo" role="button" tabindex="0" aria-label="All drills">${MARK(26)}</a><div class="board">${it.board ? cards(it.board) : ''}</div><span class="grow"></span><span class="score"><b>${good}</b>/${res.length}</span><button type="button" class="icon" aria-label="Settings">${icon('settings')}</button></header>
      <section class="t-stage"><div class="left">${it.left ? it.left(given) : ''}</div><div class="ask" aria-live="polite"><div class="kind">${d.kind} · ${at + 1} of ${d.items.length}</div>${it.hand ? `<h2>${cards(it.hand)}</h2>` : it.plain ? `<h2 class="plain">${it.plain}</h2>` : ''}${it.sub ? `<div class="sub">${it.sub}</div>` : ''}<p class="text">${it.text}</p>${opts}${verdict}</div></section></main>`;
    app.querySelector('.logo').onclick = menu;
    if (given != null) app.querySelector('#next').onclick = () => { at++; if (at < d.items.length) { show(null); window.scrollTo(0, 0); } else { done[d.id] = `${res.filter(Boolean).length}/${res.length}`; menu(); } };
    else if (it.tap) { const t = app.querySelector('.strip.tap'); t.onclick = (e) => { const r = t.getBoundingClientRect(); const g = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); res.push(Math.abs(g - it.answer) <= 0.07); show(g); }; }
    else app.querySelector('.opts').onclick = (e) => { const b = e.target.closest('.opt'); if (!b) return; res.push(b.dataset.v === it.answer); show(b.dataset.v); }; };
  show(null); window.scrollTo(0, 0); }
menu();
</script>
