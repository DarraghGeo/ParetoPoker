<title>Pareto drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a menu of drills in three groups; each drill is one card worked top to bottom: question, answer, reason, next. */
:root{
  --bg:#FAFAF7;--surface:#F1F0EB;--line:#E6E4DD;--line-strong:#CFCDC4;--ink:#15171B;--ink-2:#4F535B;--ink-3:#6B6F77;--accent:#2A3CE0;
  --ok:#1C8A78;--miss:#C93A24;--oop:#2A3CE0;--ip:#D9792B;--idle:#E3E1D9;--card:#FFFFFF;--pass:#58B787;--agg:#DD4B39;--fold:#CFCDC4;--cell:#2A3CE0;
  --s-s:#15171B;--s-h:#C8281F;--s-d:#0B6FC2;--s-c:#17803F;
  --sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316;--surface:#1B1D21;--line:#2A2C31;--line-strong:#3C3F46;--ink:#ECEBE6;--ink-2:#B4B6BC;--ink-3:#8D9098;--accent:#8E9BFF;
  --ok:#4FBFA9;--miss:#F0766C;--oop:#8E9BFF;--ip:#E69A55;--idle:#33353B;--card:#17181B;--pass:#3F9C6E;--agg:#D2513F;--fold:#4A4C53;--cell:#8E9BFF;
  --s-s:#ECEBE6;--s-h:#F0766C;--s-d:#62A8EA;--s-c:#5FBF83;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316;--surface:#1B1D21;--line:#2A2C31;--line-strong:#3C3F46;--ink:#ECEBE6;--ink-2:#B4B6BC;--ink-3:#8D9098;--accent:#8E9BFF;
  --ok:#4FBFA9;--miss:#F0766C;--oop:#8E9BFF;--ip:#E69A55;--idle:#33353B;--card:#17181B;--pass:#3F9C6E;--agg:#D2513F;--fold:#4A4C53;--cell:#8E9BFF;
  --s-s:#ECEBE6;--s-h:#F0766C;--s-d:#62A8EA;--s-c:#5FBF83;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/23px var(--sans);padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:600 24px/30px var(--sans);margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);max-width:60ch}
.tag{font:500 11px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font:600 15px/20px var(--sans);margin:6px 0 0;display:flex;gap:8px;align-items:baseline}
.group h2 small{font:400 12px/16px var(--mono);color:var(--ink-3)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);font:500 15px/20px var(--sans)}
.item small{display:block;font:400 13px/18px var(--sans);color:var(--ink-2)}
.item .st{font:500 12px/16px var(--mono);color:var(--ink-3);white-space:nowrap}
.item .st.done{color:var(--ok)}
.screen{background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{border:0;background:none;padding:4px 0;font:500 13px/18px var(--mono);color:var(--ink-2);cursor:pointer}
.dots{display:flex;gap:5px}.dots i{width:16px;height:4px;border-radius:2px;background:var(--idle)}.dots i.on{background:var(--ink)}.dots i.good{background:var(--ok)}.dots i.bad{background:var(--miss)}
.board{font:500 24px/28px var(--mono);letter-spacing:.02em}
.s{color:var(--s-s)}.h{color:var(--s-h)}.d{color:var(--s-d)}.c{color:var(--s-c)}
.ctx{font:400 13px/20px var(--mono);color:var(--ink-2)}.ctx b{color:var(--ink);font-weight:500}
.q{font:600 18px/24px var(--sans)}
.hero{font:500 34px/40px var(--mono)}
.opts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.opts.col{grid-template-columns:1fr}
.opts button{font:500 14px/20px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:11px 8px;cursor:pointer;text-align:center}
.opts.col button{text-align:left;padding:10px 12px}
.opts button small{display:block;font:400 11px/14px var(--mono);color:var(--ink-3)}
button:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts button[data-res="right"]{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opts button[data-res="wrong"]{border-color:var(--miss);box-shadow:inset 0 0 0 1px var(--miss)}
.go{font:500 14px/20px var(--sans);background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:11px;cursor:pointer}
.after{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.verdict{font:600 16px/22px var(--sans)}.verdict.good{color:var(--ok)}.verdict.bad{color:var(--miss)}
.why{font-size:15px;color:var(--ink)}.soft{font-size:14px;color:var(--ink-2)}
.rule{font:400 13px/19px var(--sans);color:var(--ink-2);background:var(--surface);padding:10px 12px;border-radius:6px}.rule b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);max-width:340px}
.grid i{aspect-ratio:1;background:var(--card);position:relative;display:block}
.grid i b{position:absolute;inset:0;background:var(--cell)}
.gl{display:flex;justify-content:space-between;font:400 11px/14px var(--mono);color:var(--ink-3);max-width:340px}
.split{display:flex;height:26px;border-radius:3px;overflow:hidden;font:500 12px/26px var(--mono);color:#fff}
.split span{display:block;padding:0 8px;white-space:nowrap;overflow:hidden}.split span:last-child{text-align:right}
.count{display:flex;flex-direction:column;gap:6px}.count.dim{opacity:.55}
.count .name{font:600 14px/20px var(--sans);display:flex;justify-content:space-between;gap:8px}.count .name small{font:400 11px/20px var(--mono);color:var(--ink-3)}
.rowc{display:grid;grid-template-columns:34px 1fr 40px;gap:8px;align-items:center;font:400 12px/16px var(--mono);color:var(--ink-2)}
.rowc .m{height:12px;background:var(--idle);border-radius:2px;overflow:hidden}.rowc .m i{display:block;height:100%}
.rowc span:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.exs{font:400 12px/17px var(--mono);color:var(--ink-3);padding-left:42px}
.bar{position:relative;height:60px;display:flex;border-radius:3px;background:var(--idle)}
.bar u{flex:1 1 0;display:flex;flex-direction:column;min-width:0;text-decoration:none}.bar u b{display:block;width:100%}
.bar.tap{cursor:pointer;outline:1px dashed var(--line-strong);outline-offset:3px}
.vline{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.vline.g{background:var(--accent);box-shadow:none}
.vline span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:500 10px/13px var(--mono);color:var(--ink-2);white-space:nowrap}
.vline.dn span{bottom:auto;top:100%}
.ends{display:flex;justify-content:space-between;font:400 11px/14px var(--mono);color:var(--ink-3);margin-top:16px}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 12px/16px var(--mono);color:var(--ink-2)}.key i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.shapes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.shapes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;font:400 11px/14px var(--sans)}
.mini{display:flex;width:100%;max-width:54px;height:26px;background:var(--pass);align-items:flex-end}.mini b{flex:1;background:var(--agg);display:block}
.counts{display:flex;gap:20px}.counts div{font:400 12px/17px var(--mono);color:var(--ink-2)}.counts b{display:block;font:600 24px/28px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.pairrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font:400 13px/18px var(--mono);align-items:center;color:var(--ink-2)}.pairrow b{font-weight:500;color:var(--ink)}
.meter{height:8px;background:var(--idle);border-radius:2px;overflow:hidden;display:flex}.meter i{display:block;height:100%}
.note{font-size:13px;line-height:20px;color:var(--ink-3)}
</style>
<main id="app"></main>
<script>
const D = /*DATA*/;
const SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' }; const NAMES = { SRP: 'Single-raised pot', '3BP': '3-bet pot', '4BP': '4-bet pot', Squeeze: 'Squeezed pot' }; const STREET = { 3: 'flop', 4: 'turn', 5: 'river' };
const cards = (t) => t.replace(/ /g, '').match(/[2-9TJQKA][shdc]/g).map((c) => `<span class="${c[1]}">${c[0]}${SUIT[c[1]]}</span>`).join(' '); const pct = (x) => `${Math.round(100 * x)}%`;
const app = document.getElementById('app'); const done = {};
const grid = (g) => `<div class="grid">${g.flat().map((w) => `<i>${w > 0 ? `<b style="opacity:${0.25 + 0.75 * w}"></b>` : ''}</i>`).join('')}</div><div class="gl"><span>AA top left · suited above the diagonal</span><span>22</span></div>`;
const bar = (rows, cols, cls = '') => `<div class="bar ${cls}">${rows.map((m) => `<u>${m.map((p, a) => `<b style="height:${100 * p}%;background:${cols[a]}"></b>`).join('')}</u>`).join('')}</div>`;
const choice = (opts, n, col) => `<div class="opts${col ? ' col' : ''}" style="--n:${n ?? opts.length}">${opts.map(([v, label, sub]) => `<button data-v="${v}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`).join('')}</div>`;

// ---------- the drills: each a list of questions { head, ask, input, answer, after(given) }
const DRILLS = [];
// 1. ranges
DRILLS.push({ id: 'whose', group: 0, name: 'Whose range is this?', sub: 'See a range, name the position and action', items: [2, 0, 3].map((k) => ({ head: grid(D.grids[k].g), ask: 'Whose range is this?', input: choice(D.grids.map((g, i) => [i, g.label]), 1, true), answer: String(k),
  after: () => `<p class="why">${['The tightest open: big pairs, big aces and suited broadways, almost nothing offsuit below AJ.', 'The widest open: every pair, most suited hands and a wide band of offsuit broadways.', 'A calling range has a hole at the top: the best hands 3-bet, so AA, KK and AK are missing. What is left is suited and connected.', 'A 3-betting range is the top of the deck plus a few suited bluffs, with the middle left out.'][k]}</p><div class="rule">In the app this would cycle through all 49 preset ranges, coming back sooner to the ones you miss.</div>` })) });
DRILLS.push({ id: 'inout', group: 0, name: 'In or out?', sub: 'See a position and a hand, say if it is in the range', items: D.inout.hands.slice(0, 5).map(([h, w]) => ({ head: `<div class="ctx">${D.inout.line}. <b>${D.inout.who}'s range.</b></div><div class="hero">${h}</div>`, ask: `Is it in ${D.inout.who}'s range?`, input: choice([['a', 'Always', 'or nearly'], ['s', 'Sometimes'], ['n', 'Never']]), answer: w >= 0.85 ? 'a' : w <= 0.05 ? 'n' : 's',
  after: () => `<p class="why">${D.inout.who} calls with ${h} ${w >= 0.85 ? `nearly always (${pct(w)})` : w <= 0.05 ? 'never' : `${pct(w)} of the time`}.${h === 'AKo' ? ' It is too strong to call: it 3-bets.' : h === 'J7o' ? ' Offsuit and unconnected: it folds.' : w > 0.05 && w < 0.85 ? ' The rest of the time it 3-bets or folds.' : ''}</p>` })) });
// 2. range advantage
const C = D.cards; DRILLS.push({ id: 'card', group: 1, name: 'Whose card is it?', sub: 'One rank, two ranges: who holds more of it', items: ['K', '5', '9', 'A'].map((r) => { const [a, b] = C.share[r]; const ans = Math.abs(a - b) < 0.025 ? 'close' : a > b ? '0' : '1'; return { head: `<div class="ctx">${C.line}.</div><div class="hero">${r}</div>`, ask: 'Who has more hands with this rank in them, as a share of the range?', input: choice([['0', C.names[0]], ['close', 'Close'], ['1', C.names[1]]]), answer: ans,
  after: () => `${[0, 1].map((i) => `<div class="rowc"><span>${C.names[i]}</span><div class="m"><i style="width:${250 * C.share[r][i]}%;background:var(--${i ? 'ip' : 'oop'})"></i></div><span>${pct(C.share[r][i])}</span></div>`).join('')}<p class="why">${ans === 'close' ? 'About the same share of each range. Nines sit where the two ranges overlap: both hold plenty of suited and connected nines.' : `${C.names[+ans]} has more of them.`} ${ans === 'close' ? '' : 'AKQJT'.includes(r) ? 'The opener holds more of the high cards: the caller 3-bets some of its best ones and the opener starts with more offsuit broadways.' : 'The caller holds more of the low and middle cards: it defends wide with suited and connected hands the opener folds.'}</p><div class="rule">When this rank is the top card on the board, this is who has more top pair.</div>` }; }) });
const reason = (q) => { const [a, b] = q.sides; const w = q.answer; const N = q.names; const sg = Math.sign(q.eq[0] - 0.5); const d = (k) => Math.sign(a[k] - b[k]); const v = (k, i) => pct(q.sides[i][k]);
  if (w === 'close') return { key: null, text: `It is close: ${pct(q.eq[0])} against ${pct(q.eq[1])}. ${a.tp > b.tp ? N[0] : N[1]} has more top pair or better, but ${a.pair > b.pair ? N[0] : N[1]} has more pairs and more of the biggest hands. They cancel.` };
  const W = N[w], L = N[1 - w];
  if (q.bettor != null) return { key: d('big') === sg ? 'big' : 'tp', text: `${N[q.bettor]} bet. A river bet is made of strong hands and bluffs, so after a bet the bettor nearly always has the advantage. The count agrees: ${v('big', w)} of ${W}'s range is two pair or better, against ${v('big', 1 - w)}.` };
  if (q.street === 5 && d('tp') !== sg && d('big') === sg) return { key: 'big', text: `Top pair is not the bar on the river. Top pair or better is level, but ${v('big', w)} of ${W}'s range is two pair or better, against ${v('big', 1 - w)} of ${L}'s.` };
  if (d('tp') === sg) return { key: 'tp', text: `${W} has more top pair or better on this board: ${v('tp', w)} of the range, against ${v('tp', 1 - w)} of ${L}'s.` };
  return { key: 'pair', text: `The exception. ${L} has more top pair or better (${v('tp', 1 - w)} against ${v('tp', w)}), but ${W} has far more pairs of any kind: ${v('pair', w)} against ${v('pair', 1 - w)}. On a low board those pairs are worth a lot.` }; };
const RULE = { 3: '<b>Flop:</b> who has more top pair or better, as a share of the range.', 4: '<b>Turn:</b> the same count, then lean towards whoever has been betting.', 5: '<b>River:</b> the bar rises to two pair or better, and whoever bet usually has it.' };
DRILLS.push({ id: 'adv', group: 1, name: 'Who has the range advantage?', sub: 'A board and the action so far', items: D.adv.map((q) => { const tell = (t) => t.replace(/OOP/g, q.names[0]).replace(/IP/g, q.names[1]); const hist = q.hist.map((h, i) => `${['Flop', 'Turn'][i]}: ${tell(h)}.`).join(' '); const cur = q.street === 3 ? '' : `${q.street === 4 ? 'Turn' : 'River'}: ${tell(q.cur)}.`;
  return { head: `<div class="board">${cards(q.board)}</div><div class="ctx">${NAMES[q.pre]}. <b>${q.names[0]}</b> out of position, <b>${q.names[1]}</b> in position.${hist || cur ? `<br>${hist} ${cur}` : ''}</div>`, ask: 'Who has the range advantage?', input: choice([['0', q.names[0], 'out of position'], ['close', 'Close', 'within 2 points'], ['1', q.names[1], 'in position']]), answer: String(q.answer),
    after: () => { const r = reason(q); const row = (k, name, ex) => `<div class="count${r.key && r.key !== k ? ' dim' : ''}"><div class="name">${name}${r.key === k ? '<small>this decides it</small>' : ''}</div>${[0, 1].map((i) => `<div class="rowc"><span>${q.names[i]}</span><div class="m"><i style="width:${100 * q.sides[i][k]}%;background:var(--${i ? 'ip' : 'oop'})"></i></div><span>${pct(q.sides[i][k])}</span></div>${ex && r.key === k && q.sides[i][ex].length ? `<div class="exs">${q.sides[i][ex].join(' ')}</div>` : ''}`).join('')}</div>`;
      return `<div class="split"><span style="width:${100 * q.eq[0]}%;background:var(--oop)">${q.names[0]} ${pct(q.eq[0])}</span><span style="width:${100 * q.eq[1]}%;background:var(--ip)">${pct(q.eq[1])} ${q.names[1]}</span></div><p class="why">${r.text}</p>${row('tp', 'Top pair or better', 'exTp')}${q.street === 5 || r.key === 'big' ? row('big', 'Two pair or better', 'exBig') : ''}${row('pair', 'Any pair or better', null)}<div class="rule">${RULE[q.street]}</div>`; } }; }) });
const T = D.turn; DRILLS.push({ id: 'moved', group: 1, name: 'Did the card move it?', sub: 'A turn card lands: who does it help', items: T.turns.map((t) => { const d = t.eq - T.eq; const ans = Math.abs(d) < 0.008 ? 'same' : d > 0 ? '0' : '1'; const r = t.card[0]; return { head: `<div class="board">${cards(T.flop)} <span style="color:var(--ink-3)">→</span> ${cards(t.card)}</div><div class="ctx">${NAMES[T.pre]}, ${T.names[0]} against ${T.names[1]}. On the flop ${T.names[1]} was slightly ahead (${pct(1 - T.eq)} to ${pct(T.eq)}). No betting yet.</div>`, ask: 'Who does this card help?', input: choice([['0', T.names[0]], ['same', 'No one', 'under a point'], ['1', T.names[1]]]), answer: ans,
  after: () => `<div class="split"><span style="width:${100 * t.eq}%;background:var(--oop)">${T.names[0]} ${(100 * t.eq).toFixed(1)}%</span><span style="width:${100 * (1 - t.eq)}%;background:var(--ip)">${(100 * (1 - t.eq)).toFixed(1)}% ${T.names[1]}</span></div><p class="why">${ans === 'same' ? 'It barely moves.' : `It moves ${Math.abs(100 * d).toFixed(1)} points towards ${T.names[+ans]}.`} ${'AK'.includes(r) ? `A high card is the opener's card: ${T.names[1]} has more hands with ${r === 'A' ? 'an ace' : 'a king'} in them, so more of its range just made top pair.` : r === '6' ? `A middle card that connects with the board is the caller's card: ${T.names[0]} has more of the sixes, eights and tens that make straights and two pair here.` : `The third spade helps the caller a little: its range has more suited hands, so more flushes.`}</p><div class="rule">Ask the "whose card is it?" question of the new card.</div>` }; }) });
// 3. actions
const RV = D.river; const SH = { 'Check everything': [10, 6, 5, 4, 4, 5, 8, 12, 13, 13], 'Top, some rest': [34, 33, 31, 27, 21, 20, 22, 38, 66, 74], 'Both ends': [82, 53, 19, 9, 8, 21, 59, 86, 92, 91], 'Top half': [29, 33, 38, 37, 41, 66, 82, 86, 88, 82], 'Bet everything': [74, 72, 66, 62, 71, 77, 80, 86, 92, 91] };
const rbet = RV.actions.filter((a) => a.kind !== 'check').reduce((t, a) => t + a.freq, 0); const rhead = `<div class="board">${cards(RV.board)}</div><div class="ctx">Single-raised pot, SB against BB. You are SB, first to act on the river.</div><div class="counts"><div><b>${pct(RV.top70[0])}</b>of your hands beat 70% of his</div><div><b>${pct(RV.top70[1])}</b>of his beat 70% of yours</div></div>`;
const rafter = `<div>${bar(RV.bar, ['var(--pass)', 'var(--agg)'])}<div class="ends" style="margin-top:4px"><span>your weakest</span><span>your strongest</span></div></div><div class="key"><span><i style="background:var(--pass)"></i>check</span><span><i style="background:var(--agg)"></i>bet 75%</span></div>`;
DRILLS.push({ id: 'range', group: 2, name: 'How does the range bet?', sub: 'How often, and in what shape', items: [
  { head: rhead, ask: 'How much of your range bets?', input: choice([['a', 'Under 20%'], ['b', '20 to 45%'], ['c', '45 to 70%'], ['d', 'Over 70%']], 2), answer: 'b', after: () => `${rafter}<p class="why">You bet ${pct(rbet)} of the range. You have twice his share of strong hands, so you can bet. But most of your range is middling hands that win often enough by checking.</p>` },
  { head: rhead, ask: 'Which shape does the betting take?', input: `<div class="opts shapes">${Object.entries(SH).map(([n, p]) => `<button data-v="${n}"><span class="mini">${p.map((v) => `<b style="height:${v}%"></b>`).join('')}</span>${n}</button>`).join('')}</div>`, answer: 'Both ends', after: () => `${rafter}<p class="why">Both ends. The strongest hands bet for value and the weakest bet as bluffs, because they cannot win a showdown. The middle checks.</p><div class="rule">A betting range is nearly always one of these five shapes. Name the shape and you have most of the answer.</div>` }] });
const F = D.face; const fb = Math.round(100 * F.toCall / (F.pot - F.toCall));
DRILLS.push({ id: 'line', group: 2, name: 'Where is the line?', sub: 'Facing a bet: how much of your range continues', items: [{ head: `<div class="board">${cards(F.board)}</div><div class="ctx">Single-raised pot, SB against UTG. You are UTG. River: SB bets ${fb}% of the pot.</div>`, ask: 'Tap the bar where calling starts.', tap: true,
  input: `<div>${bar(F.bar.map(() => [1]), ['var(--idle)'], 'tap')}<div class="ends"><span>your weakest</span><span>your strongest</span></div></div>`, answer: 1 - F.cont,
  after: (g) => `<div>${`<div class="bar" style="position:relative">${F.bar.map((m) => `<u>${m.map((p, a) => `<b style="height:${100 * p}%;background:${['var(--fold)', 'var(--pass)'][a]}"></b>`).join('')}</u>`).join('')}<div class="vline g dn" style="left:${100 * g}%"><span>you</span></div><div class="vline" style="left:${100 * (1 - F.cont)}%"><span>line</span></div><div class="vline dn" style="left:${100 * (1 - F.priceRank)}%;opacity:.7"><span>price</span></div></div>`}<div class="ends"><span>your weakest</span><span>your strongest</span></div></div><div class="key"><span><i style="background:var(--fold)"></i>fold</span><span><i style="background:var(--pass)"></i>call</span></div><p class="why">You continue with the top ${pct(F.cont)} of your range. ${pct(F.priceRank)} of your hands have the ${pct(F.price)} equity a call needs, but the line sits above the price: the hands just over it are beaten too often by what he bets.</p><div class="rule">Facing a bet, the whole answer is one line on your range.</div>` }] });
DRILLS.push({ id: 'hand', group: 2, name: 'What does this hand do?', sub: 'One hand, then its twin', items: [
  { head: `<div class="board">${cards('Ad8h5d7d')}</div><div class="ctx">Single-raised pot, SB against BB. Flop checked through; SB checks the turn. You are BB.</div><div class="hero">${cards('Td9s')}</div><div class="ctx">37% equity</div>`, ask: 'What does it do, and why?', input: choice([['x1', 'Check: it wins often enough at showdown'], ['b1', 'Bet: it wins nothing unless it improves'], ['b2', 'Bet: worse hands will call']], 1, true), answer: 'b1', after: () => `<p class="why"><b>It always bets.</b> Every bit of its 37% comes from cards still to come. Checked down, it wins nothing. He folds about half the time, and when called it can still get there.</p>` },
  { head: `<div class="board">${cards('Ad8h5d7d')}</div><div class="ctx">Same spot.</div><div class="hero">${cards('3h3s')}</div><div class="ctx">36% equity: the same as ${'T♦9♠'}</div>`, ask: 'What does it do?', input: choice([['x', 'Check'], ['b', 'Bet 75%']]), answer: 'x', after: () => `<p class="why"><b>It never bets.</b> Nearly all of its 36% is showdown: it is ahead of his missed hands now and has almost nothing to improve to.</p><div class="pairrow"><b>${cards('Td9s')}</b><div class="meter"><i style="width:0%;background:var(--ink)"></i><i style="width:37%;background:var(--accent)"></i></div><span>bets</span><b>${cards('3h3s')}</b><div class="meter"><i style="width:34%;background:var(--ink)"></i><i style="width:2%;background:var(--accent)"></i></div><span>checks</span></div><div class="key"><span><i style="background:var(--ink)"></i>wins now</span><span><i style="background:var(--accent)"></i>wins if it improves</span></div><div class="rule">Same equity, opposite play. Among weak hands, what is still to come decides who bets.</div>` }] });

// ---------- the shell
const GROUPS = [['Ranges', 'know what each position holds'], ['Range advantage', 'who is ahead on this board'], ['Actions', 'what the range and the hand do']];
function menu() { app.innerHTML = `<div><div class="tag">Mock-up · every drill, real spots</div><h1>Pareto drills</h1></div><p>Three things to learn, in order: the ranges, who has the advantage, and what to do about it. Each drill asks first and explains after.</p>` + GROUPS.map(([g, sub], i) => `<div class="group"><h2>${i + 1}. ${g}<small>${sub}</small></h2>${DRILLS.filter((d) => d.group === i).map((d) => `<button class="item" data-id="${d.id}"><span>${d.name}<small>${d.sub}</small></span><span class="st${done[d.id] ? ' done' : ''}">${done[d.id] ?? `${d.items.length} ›`}</span></button>`).join('')}</div>`).join('') + `<p class="note">Every range, equity, count and action bar is real: the app's preset ranges and solved spots. The explanation sentences are written for the mock-up. Each drill shows only a handful of questions; in the app they would be drawn fresh and missed ones would come back.</p>`;
  app.querySelectorAll('.item').forEach((b) => { b.onclick = () => run(DRILLS.find((d) => d.id === b.dataset.id)); }); window.scrollTo(0, 0); }
function run(d) { let at = 0; const res = [];
  const show = (given) => { const it = d.items[at]; const dots = d.items.map((_, i) => `<i class="${i < res.length ? (res[i] ? 'good' : 'bad') : i === at ? 'on' : ''}"></i>`).join('');
    let html = `<div class="top"><button class="back">‹ Drills</button><span class="dots">${dots}</span></div><div class="tag">${d.name}</div>${it.head}<div class="q">${it.ask}</div>${given != null && it.tap ? '' : it.input}`;
    if (given != null) { const ok = res[res.length - 1]; html += `<div class="after"><div class="verdict ${ok ? 'good' : 'bad'}">${it.tap ? (ok ? 'Close: within a few hands of the line.' : given > it.answer ? 'Too tight: the line is further left.' : 'Too loose: the line is further right.') : ok ? 'Right.' : 'Not this time.'}</div>${it.after(given)}<button class="go">${at + 1 < d.items.length ? 'Next' : 'Done'}</button></div>`; }
    app.innerHTML = `<section class="screen">${html}</section>`; app.querySelector('.back').onclick = menu;
    if (given != null) { app.querySelectorAll('.opts button').forEach((b) => { b.disabled = true; if (b.dataset.v === it.answer) b.dataset.res = 'right'; else if (b.dataset.v === given) b.dataset.res = 'wrong'; }); app.querySelector('.go').onclick = () => { at++; if (at < d.items.length) { show(null); window.scrollTo(0, 0); } else { done[d.id] = `${res.filter(Boolean).length} of ${res.length} ✓`; menu(); } }; }
    else if (it.tap) { const t = app.querySelector('.tap'); t.onclick = (e) => { const r = t.getBoundingClientRect(); const g = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); res.push(Math.abs(g - it.answer) <= 0.07); show(g); }; }
    else app.querySelector('.opts').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; res.push(b.dataset.v === it.answer); show(b.dataset.v); }; };
  show(null); window.scrollTo(0, 0); }
menu();
</script>
